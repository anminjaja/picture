<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>오늘의 여행 사진 한 컷</title>
  <style>
    .card-container { display: flex; flex-wrap: wrap; gap: 16px; }
    .card { width: 220px; border: 1px solid #ddd; padding: 10px; border-radius: 8px; }
    .card img { width: 100%; height: 150px; object-fit: cover; }
  </style>
</head>
<body>
  <h1>오늘의 여행 사진 TOP 5</h1>
  <div id="photo-list" class="card-container">불러오는 중...</div>

  <script>
    // 1. 반드시 Encoding 키를 문자열 그대로 넣으세요 (encodeURIComponent 사용 금지)
    const SERVICE_KEY = "bd21b12db0e288c3985b09ce34dad04c43e57ea2693be743697926278f106d4d";
    const API_URL = `https://apis.data.go.kr/B551011/PhotoGalleryService1/galleryList1?serviceKey=${SERVICE_KEY}&numOfRows=5&pageNo=1&MobileOS=ETC&MobileApp=AppTest&_type=json`;

    async function loadPhotos() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();

        // 2. JSON 계층 구조 파싱 (response -> body -> items -> item 배열)
        const items = data.response.body.items.item;
        const container = document.getElementById("photo-list");
        container.innerHTML = "";

        items.forEach((item) => {
          // 3. GitHub Pages 배포 시 보안 오류(Mixed Content) 방지를 위해 http를 https로 변경
          const secureImgUrl = item.galWebImageUrl.replace("http://", "https://");

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <img src="${secureImgUrl}" alt="${item.galTitle}" />
            <h3>${item.galTitle}</h3>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error("API 호출 실패:", error);
        document.getElementById("photo-list").innerText = "데이터를 불러오지 못했습니다.";
      }
    }

    loadPhotos();
  </script>
</body>
</html>
